[alembic]
script_location = alembic
# sqlalchemy.url is overridden programmatically in alembic/env.py from DATABASE_URL.
# Do NOT put real credentials here — this file is committed to source control.
sqlalchemy.url = postgresql+psycopg2://placeholder

file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .
truncate_slug_length = 40

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
